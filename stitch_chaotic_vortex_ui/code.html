<style>
        @keyframes orbit {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        @keyframes counter-orbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(1); filter: blur(20px); }
            50% { opacity: 1; transform: scale(1.15); filter: blur(35px); }
        }
        @keyframes particles {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-100vh) scale(0.5); opacity: 0; }
        }

        .orbital-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            border: 1px solid rgba(236, 178, 255, 0.05);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
        }

        .orbit-animation-1 { animation: orbit 40s linear infinite; }
        .orbit-animation-2 { animation: orbit 50s linear infinite reverse; }
        .orbit-animation-3 { animation: orbit 60s linear infinite; }
        .orbit-animation-4 { animation: orbit 70s linear infinite reverse; }

        .counter-rotation {
            animation: counter-orbit inherit;
            pointer-events: auto;
        }

        .glass-card {
            backdrop-filter: blur(12px);
            background: rgba(25, 16, 28, 0.4);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }
        
        .glass-card.active {
            border: 2px solid #bd00ff;
            box-shadow: 0 0 30px rgba(189, 0, 255, 0.5);
            transform: scale(1.15);
            z-index: 110;
        }

        .glass-card:hover {
            transform: scale(1.2);
            z-index: 100;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #ecb2ff;
            border-radius: 50%;
            animation: particles 8s linear infinite;
        }

        .pulse-core {
            animation: pulse-glow 4s ease-in-out infinite;
        }

        .mask-square { clip-path: inset(0 0 0 0 round 12px); }
        .mask-triangle { clip-path: polygon(50% 0%, 0% 100%, 100% 100%); }
        .mask-circle { clip-path: circle(50% at 50% 50%); }
        .mask-hexagon { clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); }
    </style>

<script>
        // Particle Generation
        const particleContainer = document.getElementById('particle-container');
        const particleCount = 40;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            
            const size = Math.random() * 3 + 1;
            const left = Math.random() * 100;
            const duration = Math.random() * 8 + 6;
            const delay = Math.random() * 10;
            const opacity = Math.random() * 0.4 + 0.1;

            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${left}%`;
            particle.style.bottom = `-10px`;
            particle.style.animationDuration = `${duration}s`;
            particle.style.animationDelay = `-${delay}s`;
            particle.style.opacity = opacity;
            particle.style.filter = `blur(${Math.random() * 2}px)`;

            particleContainer.appendChild(particle);
        }
    </script>
